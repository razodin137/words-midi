<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORDS | Text-to-MIDI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #111;
            --bg-app: #fffbf5;
            --bg-sidebar: #fbfbfb;
            --border: #e2e2e2;
            --accent: #f59e0b;
        }
        
        body {
            background-color: var(--bg-body);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Custom UI Elements */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #555;
            margin-top: -5px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            background: #ddd;
        }
        
        .editor-font { font-family: 'JetBrains Mono', monospace; }

        /* Channel Colors for Highlights */
        .hl-0 { background-color: #fee2e2; color: #991b1b; } /* Red */
        .hl-1 { background-color: #fef3c7; color: #92400e; } /* Amber */
        .hl-2 { background-color: #dcfce7; color: #166534; } /* Green */
        .hl-3 { background-color: #dbeafe; color: #1e40af; } /* Blue */
        .hl-4 { background-color: #f3e8ff; color: #6b21a8; } /* Purple */
        .hl-5 { background-color: #fce7f3; color: #9d174d; } /* Pink */

        /* Smooth highlight transition */
        .word-span {
            border-radius: 3px;
            transition: background-color 0.1s, color 0.1s;
        }

        /* Hidden Textarea Overlay */
        .input-overlay {
            color: transparent;
            background: transparent;
            caret-color: var(--accent);
            outline: none;
            resize: none;
            overflow: hidden;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Scrollbars */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- CONSTANTS ---
        const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const SCALES = {
            'Minor': [0, 2, 3, 5, 7, 8, 10],
            'Major': [0, 2, 4, 5, 7, 9, 11],
            'Dorian': [0, 2, 3, 5, 7, 9, 10],
            'Phrygian': [0, 1, 3, 5, 7, 8, 10],
        };

        // --- AUDIO ENGINE ---
        const AudioEngine = {
            ctx: null,
            master: null,
            
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.master = this.ctx.createGain();
                    this.master.gain.value = 0.3;
                    this.master.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            playNote(freq, duration, velocity, type) {
                if (!this.ctx) return;
                const t = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, t);
                
                // ADSR-ish Envelope
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(velocity, t + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

                osc.connect(gain);
                gain.connect(this.master);
                
                osc.start(t);
                osc.stop(t + duration + 0.1);
                
                setTimeout(() => gain.disconnect(), (duration + 0.2) * 1000);
            },

            getPitch(word, root, scaleName, transpose) {
                if (!word) return null;
                let sum = 0;
                for(let i=0; i<word.length; i++) sum += word.charCodeAt(i);
                
                const scale = SCALES[scaleName];
                const noteIdx = sum % scale.length;
                const semitone = scale[noteIdx];
                const rootIdx = NOTES.indexOf(root);
                
                // Octave logic based on length
                let octave = 4;
                if (word.length > 6) octave = 3;
                if (word.length < 3) octave = 5;

                const midi = ((octave + 1) * 12) + rootIdx + semitone + transpose;
                const freq = 440 * Math.pow(2, (midi - 69) / 12);
                return freq;
            }
        };

        // --- COMPONENTS ---

        const Line = ({ id, index, text, isActive, activeWordIndex, onChange, onSelect, onKeyDown }) => {
            const textareaRef = React.useRef(null);
            
            React.useEffect(() => {
                if (isActive && textareaRef.current) {
                    textareaRef.current.focus();
                }
            }, [isActive]);

            // Auto-resize
            const handleInput = (e) => {
                e.target.style.height = 'auto';
                e.target.style.height = e.target.scrollHeight + 'px';
                onChange(index, e.target.value);
            };

            const words = text.split(' ');

            return (
                <div 
                    className={`flex group relative min-h-[36px] transition-colors ${isActive ? 'bg-black/[0.03]' : ''}`}
                    onClick={() => onSelect(index)}
                >
                    {/* Gutter */}
                    <div className="w-12 pt-2 flex-shrink-0 flex justify-center select-none">
                        <div className={`
                            w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-mono font-bold transition-all
                            ${activeWordIndex !== -1 
                                ? `bg-[var(--accent)] text-white scale-110 shadow-sm` 
                                : `text-gray-400 bg-white border border-gray-200 group-hover:border-gray-400`}
                        `}>
                            {index + 1}
                        </div>
                    </div>

                    {/* Editor Area */}
                    <div className="relative flex-grow pt-2 pr-4 pl-1">
                        
                        {/* Rendering Layer (The words you see) */}
                        <div className="absolute top-2 left-1 right-4 pointer-events-none editor-font text-lg leading-snug whitespace-pre-wrap break-words text-transparent">
                             {words.map((word, i) => (
                                <React.Fragment key={i}>
                                    <span className={`word-span text-gray-800 ${i === activeWordIndex ? `hl-${index % 6} font-medium` : ''}`}>
                                        {word}
                                    </span>
                                    <span> </span>
                                </React.Fragment>
                            ))}
                        </div>

                        {/* Input Layer (The words you type - invisible but active) */}
                        <textarea
                            ref={textareaRef}
                            rows={1}
                            value={text}
                            onInput={handleInput}
                            onKeyDown={(e) => onKeyDown(e, index)}
                            onFocus={() => onSelect(index)}
                            className="w-full input-overlay editor-font text-lg leading-snug"
                            spellCheck="false"
                            placeholder={index === 0 ? "Type here..." : ""}
                        />
                    </div>
                </div>
            );
        };

        const Slider = ({ label, value, min, max, step, unit, onChange }) => (
            <div className="mb-4">
                <div className="flex justify-between text-[11px] font-bold text-gray-400 uppercase tracking-wide mb-2">
                    <span>{label}</span>
                    <span className="text-gray-900">{value}{unit}</span>
                </div>
                <input 
                    type="range" min={min} max={max} step={step} value={value}
                    onChange={(e) => onChange(parseFloat(e.target.value))}
                    className="w-full"
                />
            </div>
        );

        const App = () => {
            // State
            const [isPlaying, setIsPlaying] = React.useState(false);
            const [bpm, setBpm] = React.useState(120);
            const [activeLine, setActiveLine] = React.useState(0);
            const [scale, setScale] = React.useState('Minor');
            const [rootNote, setRootNote] = React.useState('C');

            // Data
            const [lines, setLines] = React.useState([
                { text: "Words is a MIDI sequencer", params: { speed: 1, prob: 100, transpose: 0, vel: 0.8 } },
                { text: "That converts text to melodies", params: { speed: 0.5, prob: 90, transpose: -12, vel: 0.7 } },
                { text: "Each word has a pitch", params: { speed: 2, prob: 100, transpose: 12, vel: 0.6 } },
                { text: "Derived from its letters", params: { speed: 1, prob: 100, transpose: 0, vel: 0.8 } },
            ]);

            // Visual State
            const [cursors, setCursors] = React.useState(new Array(4).fill(-1));

            // Refs
            const requestRef = React.useRef();
            const nextNoteTimeRef = React.useRef([]);
            const activeWordIndexRef = React.useRef([]);

            // -- Logic --

            const handlePlay = () => {
                if (!isPlaying) {
                    AudioEngine.init(); // MUST happen on user gesture
                    
                    // Reset scheduling pointers
                    const now = AudioEngine.ctx.currentTime;
                    nextNoteTimeRef.current = new Array(lines.length).fill(now + 0.1);
                    activeWordIndexRef.current = new Array(lines.length).fill(0);
                    
                    setIsPlaying(true);
                } else {
                    setIsPlaying(false);
                    setCursors(new Array(lines.length).fill(-1));
                }
            };

            // Keyboard Shortcuts
            React.useEffect(() => {
                const handleKey = (e) => {
                    if (e.code === 'Space' && e.target.tagName !== 'TEXTAREA') {
                        e.preventDefault();
                        handlePlay();
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [isPlaying, lines]); // Re-bind includes latest state if needed

            // Scheduler Loop
            const schedule = () => {
                if (!isPlaying) return;

                const ctx = AudioEngine.ctx;
                const lookahead = 0.1; // 100ms
                const now = ctx.currentTime;
                const beatDur = 60 / bpm;

                lines.forEach((line, i) => {
                    const words = line.text.trim().split(/\s+/).filter(w => w.length > 0);
                    if (words.length === 0) {
                        if (cursors[i] !== -1) {
                             setCursors(prev => { const n = [...prev]; n[i] = -1; return n; });
                        }
                        return;
                    }

                    // Loop through schedule queue
                    while (nextNoteTimeRef.current[i] < now + lookahead) {
                        const wordIdx = activeWordIndexRef.current[i] % words.length;
                        const word = words[wordIdx];
                        
                        // Calculate Duration (Length-based + Speed param)
                        // Heuristic: Short words = 0.5 beats, Long words = 1 beat
                        const lengthMod = word.length > 4 ? 1 : 0.5;
                        const dur = (beatDur * lengthMod) / line.params.speed;

                        // Play Sound
                        const playTime = nextNoteTimeRef.current[i];
                        if (Math.random() * 100 <= line.params.prob) {
                            const freq = AudioEngine.getPitch(word, rootNote, scale, line.params.transpose);
                            const waves = ['sine', 'triangle', 'square', 'sawtooth'];
                            AudioEngine.playNote(freq, dur * 0.9, line.params.vel * 0.3, waves[i % 4]);
                        }

                        // Schedule Visual Update (using setTimeout to sync with audio time)
                        // We calculate the delay between "now" (when we are scheduling) and "playTime" (when it plays)
                        const timeUntilPlay = (playTime - now) * 1000;
                        const idxToHighlight = wordIdx;
                        
                        setTimeout(() => {
                            if (!isPlaying) return;
                            setCursors(prev => {
                                const n = [...prev];
                                n[i] = idxToHighlight;
                                return n;
                            });
                        }, Math.max(0, timeUntilPlay));

                        // Advance
                        nextNoteTimeRef.current[i] += dur;
                        activeWordIndexRef.current[i]++;
                    }
                });

                requestRef.current = requestAnimationFrame(schedule);
            };

            React.useEffect(() => {
                if (isPlaying) {
                    requestRef.current = requestAnimationFrame(schedule);
                } else {
                    cancelAnimationFrame(requestRef.current);
                }
                return () => cancelAnimationFrame(requestRef.current);
            }, [isPlaying, lines, bpm, scale, rootNote]);

            // -- Handlers --
            const updateLineParams = (key, val) => {
                const newLines = [...lines];
                newLines[activeLine].params = { ...newLines[activeLine].params, [key]: val };
                setLines(newLines);
            };

            const handleTextChange = (idx, val) => {
                const newLines = [...lines];
                newLines[idx].text = val;
                setLines(newLines);
            };

            const handleKeyDown = (e, idx) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const newLines = [...lines];
                    newLines.splice(idx + 1, 0, { text: "", params: { ...lines[idx].params } });
                    setLines(newLines);
                    setActiveLine(idx + 1);
                    nextNoteTimeRef.current.splice(idx+1, 0, AudioEngine.ctx.currentTime);
                    activeWordIndexRef.current.splice(idx+1, 0, 0);
                }
                if (e.key === 'Backspace' && lines[idx].text === '' && lines.length > 1) {
                    e.preventDefault();
                    const newLines = lines.filter((_, i) => i !== idx);
                    setLines(newLines);
                    setActiveLine(Math.max(0, idx - 1));
                    nextNoteTimeRef.current.splice(idx, 1);
                    activeWordIndexRef.current.splice(idx, 1);
                }
                if (e.key === 'ArrowUp') { e.preventDefault(); setActiveLine(Math.max(0, idx - 1)); }
                if (e.key === 'ArrowDown') { e.preventDefault(); setActiveLine(Math.min(lines.length - 1, idx + 1)); }
            };

            const currentParams = lines[activeLine]?.params || { speed: 1, prob: 100, transpose: 0, vel: 0.8 };

            return (
                <div className="w-[900px] h-[600px] bg-[var(--bg-app)] rounded-xl shadow-2xl flex flex-col md:flex-row overflow-hidden border border-[var(--border)]">
                    
                    {/* LEFT: Main */}
                    <div className="flex-1 flex flex-col relative">
                        
                        {/* Header / Transport */}
                        <div className="h-16 border-b border-[var(--border)] flex items-center justify-between px-6 bg-white/50 backdrop-blur">
                            
                            {/* Window Dots */}
                            <div className="flex gap-2">
                                <div className="w-3 h-3 rounded-full bg-red-400"></div>
                                <div className="w-3 h-3 rounded-full bg-yellow-400"></div>
                                <div className="w-3 h-3 rounded-full bg-green-400"></div>
                            </div>

                            {/* Center Controls */}
                            <div className="absolute left-1/2 transform -translate-x-1/2 flex items-center gap-6">
                                <button 
                                    onClick={handlePlay}
                                    className={`
                                        w-12 h-12 flex items-center justify-center rounded-full transition-all shadow-md
                                        ${isPlaying 
                                            ? 'bg-[var(--accent)] text-white hover:bg-orange-600' 
                                            : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200'}
                                    `}
                                >
                                    {isPlaying ? (
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                    ) : (
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" className="ml-1"><path d="M5 3l14 9-14 9V3z"/></svg>
                                    )}
                                </button>

                                <div className="flex gap-2 text-xs">
                                    <div className="bg-white border border-gray-200 px-3 py-1 rounded flex items-center gap-2">
                                        <span className="font-bold text-gray-400">BPM</span>
                                        <input 
                                            type="number" value={bpm} onChange={e => setBpm(parseInt(e.target.value))}
                                            className="w-8 outline-none font-mono bg-transparent"
                                        />
                                    </div>
                                    <div className="bg-white border border-gray-200 px-3 py-1 rounded flex items-center gap-2">
                                        <select value={rootNote} onChange={e => setRootNote(e.target.value)} className="bg-transparent outline-none font-medium cursor-pointer">
                                            {NOTES.map(n => <option key={n} value={n}>{n}</option>)}
                                        </select>
                                        <span className="text-gray-300">|</span>
                                        <select value={scale} onChange={e => setScale(e.target.value)} className="bg-transparent outline-none text-gray-600 cursor-pointer">
                                            {Object.keys(SCALES).map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="w-16"></div> {/* Spacer */}
                        </div>

                        {/* Editor Lines */}
                        <div className="flex-1 overflow-y-auto p-8 hide-scroll" onClick={() => setActiveLine(lines.length - 1)}>
                            {lines.map((line, i) => (
                                <Line 
                                    key={i} index={i} id={i}
                                    text={line.text}
                                    isActive={activeLine === i}
                                    activeWordIndex={cursors[i]}
                                    onChange={handleTextChange}
                                    onSelect={setActiveLine}
                                    onKeyDown={handleKeyDown}
                                />
                            ))}
                        </div>
                    </div>

                    {/* RIGHT: Inspector */}
                    <div className="w-[260px] bg-[var(--bg-sidebar)] border-l border-[var(--border)] flex flex-col">
                        <div className="h-16 flex items-center px-6 border-b border-[var(--border)]">
                            <h3 className="text-xs font-bold tracking-widest text-[var(--accent)] uppercase">Channel {activeLine + 1}</h3>
                        </div>
                        
                        <div className="p-6 overflow-y-auto hide-scroll">
                            <div className="mb-8">
                                <h4 className="text-xs font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-200">Playback</h4>
                                <Slider label="Speed" value={currentParams.speed} min={0.25} max={4} step={0.25} unit="x" onChange={v => updateLineParams('speed', v)} />
                                <Slider label="Probability" value={currentParams.prob} min={0} max={100} step={1} unit="%" onChange={v => updateLineParams('prob', v)} />
                            </div>

                            <div className="mb-8">
                                <h4 className="text-xs font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-200">Pitch</h4>
                                <Slider label="Transpose" value={currentParams.transpose} min={-24} max={24} step={1} unit="st" onChange={v => updateLineParams('transpose', v)} />
                            </div>

                            <div className="mb-8">
                                <h4 className="text-xs font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-200">Dynamics</h4>
                                <Slider label="Velocity" value={currentParams.vel} min={0} max={1} step={0.01} unit="" onChange={v => updateLineParams('vel', v)} />
                            </div>
                            
                            <div className="mt-8 p-4 bg-gray-100 rounded text-[10px] text-gray-500 leading-relaxed">
                                Tip: Press <strong className="text-gray-800">Spacebar</strong> to play/stop. Use arrow keys to navigate lines.
                            </div>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
